<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 稳定币价差监控看板</title>
    <style>
        /* ============================================================
           全局样式
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 顶部导航栏 */
        .header {
            background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #58a6ff;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #8b949e;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-dot.error {
            background: #f85149;
        }

        /* 主内容区域 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ============================================================
           概览卡片
           ============================================================ */
        .overview-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.1);
        }

        .card .label {
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 28px;
            font-weight: 700;
            color: #e6edf3;
        }

        .card .value.green { color: #3fb950; }
        .card .value.red { color: #f85149; }
        .card .value.blue { color: #58a6ff; }
        .card .value.yellow { color: #d29922; }

        .card .sub {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        /* ============================================================
           面板（表格/图表）
           ============================================================ */
        .panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-header h2 {
            font-size: 15px;
            font-weight: 600;
            color: #e6edf3;
        }

        .panel-header .badge {
            background: #30363d;
            color: #8b949e;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .panel-body {
            padding: 0;
        }

        /* ============================================================
           价格表格
           ============================================================ */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #0d1117;
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
        }

        tbody td {
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 1px solid #21262d;
            font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
        }

        tbody tr:hover {
            background: #1c2128;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .exchange-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exchange-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .exchange-dot.binance { background: #f0b90b; }
        .exchange-dot.okx { background: #fff; }
        .exchange-dot.bybit { background: #f7a600; }
        .exchange-dot.gate { background: #2354e6; }
        .exchange-dot.htx { background: #2b6dec; }

        .price-positive { color: #3fb950; }
        .price-negative { color: #f85149; }
        .price-neutral { color: #c9d1d9; }

        /* ============================================================
           价差矩阵
           ============================================================ */
        .spread-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            padding: 16px 20px;
        }

        .spread-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s ease;
        }

        .spread-item:hover {
            border-color: #58a6ff;
        }

        .spread-item.alert {
            border-color: #f85149;
            background: #1c0d0d;
            animation: alertPulse 2s infinite;
        }

        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); }
            50% { box-shadow: 0 0 0 4px rgba(248, 81, 73, 0.1); }
        }

        .spread-pair {
            font-size: 14px;
            font-weight: 600;
            color: #e6edf3;
            margin-bottom: 8px;
        }

        .spread-values {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .spread-pct {
            font-size: 24px;
            font-weight: 700;
            font-family: 'SF Mono', monospace;
        }

        .spread-pct.low { color: #3fb950; }
        .spread-pct.medium { color: #d29922; }
        .spread-pct.high { color: #f85149; }

        /* ============================================================
           告警日志
           ============================================================ */
        .alerts-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .alert-item {
            padding: 12px 20px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 13px;
        }

        .alert-item:last-child {
            border-bottom: none;
        }

        .alert-time {
            color: #8b949e;
            font-family: monospace;
            white-space: nowrap;
            min-width: 70px;
        }

        .alert-icon {
            font-size: 16px;
        }

        .alert-text {
            color: #f85149;
            line-height: 1.5;
        }

        .no-alerts {
            padding: 40px 20px;
            text-align: center;
            color: #8b949e;
            font-size: 14px;
        }

        /* ============================================================
           图表区域
           ============================================================ */
        .chart-container {
            padding: 20px;
            height: 300px;
            position: relative;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ============================================================
           响应式布局
           ============================================================ */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================================
           滚动条美化
           ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* ============================================================
           加载动画
           ============================================================ */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #8b949e;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 闪烁警告标志 */
        .alert-badge {
            display: inline-block;
            background: #f85149;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            animation: alertFlash 1.5s infinite;
        }

        @keyframes alertFlash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

<!-- ============================================================
     页面头部
     ============================================================ -->
<div class="header">
    <h1>💰 稳定币价差监控看板</h1>
    <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">连接中...</span>
        <span>|</span>
        <span id="lastUpdate">--</span>
    </div>
</div>

<!-- ============================================================
     主内容区域
     ============================================================ -->
<div class="container">

    <!-- 概览卡片 -->
    <div class="overview-cards">
        <div class="card">
            <div class="label">监控交易所</div>
            <div class="value blue" id="exchangeCount">0</div>
            <div class="sub">在线数量</div>
        </div>
        <div class="card">
            <div class="label">最大价差</div>
            <div class="value green" id="maxSpread">0.0000%</div>
            <div class="sub" id="maxSpreadPair">--</div>
        </div>
        <div class="card">
            <div class="label">告警阈值</div>
            <div class="value yellow" id="threshold">0.03%</div>
            <div class="sub">超过此值触发告警</div>
        </div>
        <div class="card">
            <div class="label">累计告警</div>
            <div class="value red" id="alertCount">0</div>
            <div class="sub">本次运行期间</div>
        </div>
        <div class="card">
            <div class="label">数据采集</div>
            <div class="value blue" id="tickCount">0</div>
            <div class="sub">次数据更新</div>
        </div>
    </div>

    <!-- 各交易所价格 -->
    <div class="panel">
        <div class="panel-header">
            <h2>📡 各交易所 USDT/USDC 实时价格</h2>
            <span class="badge" id="priceUpdateTime">--</span>
        </div>
        <div class="panel-body">
            <div class="loading" id="priceLoading">
                <div class="spinner"></div>
                正在获取价格数据...
            </div>
            <table id="priceTable" style="display:none;">
                <thead>
                    <tr>
                        <th>交易所</th>
                        <th>买价 (Bid)</th>
                        <th>卖价 (Ask)</th>
                        <th>中间价 (Mid)</th>
                        <th>买-卖价差</th>
                        <th>数据来源</th>
                    </tr>
                </thead>
                <tbody id="priceBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 价差矩阵 -->
    <div class="panel">
        <div class="panel-header">
            <h2>📊 跨交易所价差</h2>
            <span class="badge" id="spreadCount">--</span>
        </div>
        <div class="panel-body">
            <div class="loading" id="spreadLoading">
                <div class="spinner"></div>
                正在计算价差...
            </div>
            <div class="spread-grid" id="spreadGrid" style="display:none;"></div>
        </div>
    </div>

    <!-- 图表 + 告警日志 并排 -->
    <div class="grid-2">
        <!-- 价差趋势图 -->
        <div class="panel">
            <div class="panel-header">
                <h2>📈 价差趋势</h2>
                <span class="badge">最近 60 次</span>
            </div>
            <div class="panel-body">
                <div class="chart-container">
                    <canvas id="spreadChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 告警日志 -->
        <div class="panel">
            <div class="panel-header">
                <h2>🚨 告警日志</h2>
                <span class="badge" id="alertLogCount">0 条</span>
            </div>
            <div class="panel-body">
                <div class="alerts-list" id="alertsList">
                    <div class="no-alerts">暂无告警记录</div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- ============================================================
     简易 Canvas 图表库（不依赖外部库）
     ============================================================ -->
<script>
/**
 * SimpleChart - 轻量级 Canvas 图表绘制
 * 支持多线趋势图，适用于实时数据展示
 */
class SimpleChart {
    constructor(canvasId, options = {}) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.options = {
            padding: { top: 30, right: 20, bottom: 40, left: 60 },
            gridColor: '#21262d',
            textColor: '#8b949e',
            fontSize: 11,
            colors: ['#58a6ff', '#f85149', '#3fb950', '#d29922', '#bc8cff', '#f0883e'],
            ...options,
        };
        this.data = {}; // {label: [{x, y}]}
        this.threshold = 0;
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = rect.width * dpr;
        this.canvas.height = rect.height * dpr;
        this.canvas.style.width = rect.width + 'px';
        this.canvas.style.height = rect.height + 'px';
        this.ctx.scale(dpr, dpr);
        this.width = rect.width;
        this.height = rect.height;
        this.draw();
    }

    setData(data, threshold = 0) {
        this.data = data;
        this.threshold = threshold;
        this.draw();
    }

    draw() {
        const ctx = this.ctx;
        const pad = this.options.padding;
        const w = this.width - pad.left - pad.right;
        const h = this.height - pad.top - pad.bottom;

        // 清除画布
        ctx.clearRect(0, 0, this.width, this.height);

        // 获取所有数据点
        const allLabels = [];
        const allValues = [];
        const seriesNames = Object.keys(this.data);
        for (const name of seriesNames) {
            for (const pt of this.data[name]) {
                if (!allLabels.includes(pt.x)) allLabels.push(pt.x);
                allValues.push(pt.y);
            }
        }

        if (allLabels.length === 0) {
            ctx.fillStyle = this.options.textColor;
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('等待数据...', this.width / 2, this.height / 2);
            return;
        }

        const minY = Math.min(...allValues, this.threshold) * 0.9;
        const maxY = Math.max(...allValues, this.threshold) * 1.2;

        const xScale = (i) => pad.left + (i / Math.max(allLabels.length - 1, 1)) * w;
        const yScale = (v) => pad.top + h - ((v - minY) / Math.max(maxY - minY, 0.001)) * h;

        // 绘制网格
        ctx.strokeStyle = this.options.gridColor;
        ctx.lineWidth = 1;
        const gridLines = 5;
        for (let i = 0; i <= gridLines; i++) {
            const y = pad.top + (i / gridLines) * h;
            ctx.beginPath();
            ctx.moveTo(pad.left, y);
            ctx.lineTo(pad.left + w, y);
            ctx.stroke();

            // Y 轴标签
            const val = maxY - (i / gridLines) * (maxY - minY);
            ctx.fillStyle = this.options.textColor;
            ctx.font = `${this.options.fontSize}px monospace`;
            ctx.textAlign = 'right';
            ctx.fillText(val.toFixed(4) + '%', pad.left - 8, y + 4);
        }

        // X 轴标签（最多显示 10 个）
        const step = Math.max(1, Math.floor(allLabels.length / 10));
        for (let i = 0; i < allLabels.length; i += step) {
            ctx.fillStyle = this.options.textColor;
            ctx.font = `${this.options.fontSize}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillText(allLabels[i], xScale(i), pad.top + h + 20);
        }

        // 绘制告警阈值线
        if (this.threshold > 0) {
            const ty = yScale(this.threshold);
            ctx.strokeStyle = '#f85149';
            ctx.lineWidth = 1;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(pad.left, ty);
            ctx.lineTo(pad.left + w, ty);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#f85149';
            ctx.font = `${this.options.fontSize}px sans-serif`;
            ctx.textAlign = 'left';
            ctx.fillText(`阈值 ${this.threshold}%`, pad.left + 4, ty - 6);
        }

        // 绘制各系列线条
        seriesNames.forEach((name, si) => {
            const color = this.options.colors[si % this.options.colors.length];
            const points = this.data[name];

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            ctx.beginPath();
            points.forEach((pt, i) => {
                // 找到 x 坐标
                const xi = allLabels.indexOf(pt.x);
                if (xi === -1) return;
                const px = xScale(xi);
                const py = yScale(pt.y);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            ctx.stroke();

            // 绘制点
            points.forEach((pt) => {
                const xi = allLabels.indexOf(pt.x);
                if (xi === -1) return;
                const px = xScale(xi);
                const py = yScale(pt.y);
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            });
        });

        // 图例
        seriesNames.forEach((name, si) => {
            const color = this.options.colors[si % this.options.colors.length];
            const lx = pad.left + si * 120;
            const ly = 16;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(lx, ly, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = this.options.textColor;
            ctx.font = `${this.options.fontSize}px sans-serif`;
            ctx.textAlign = 'left';
            ctx.fillText(name, lx + 10, ly + 4);
        });
    }
}
</script>

<!-- ============================================================
     主逻辑脚本

<script>
/**
 * StablecoinMonitorDashboard
 * 看板主逻辑，定期从后端 API 获取数据并更新 UI
 */
class StablecoinMonitorDashboard {
    constructor(apiBase = '') {
        this.apiBase = apiBase;
        this.refreshInterval = 3000;  // 3秒刷新一次
        this.chart = null;
        this.chartData = {};          // {pair_name: [{x: time, y: pct}]}
        this.maxChartData = 60;       // 图表最多显示 60 个点
        this.tickCount = 0;
        this.alerts = [];
        this.threshold = 0.03;

        this.initChart();
        this.startPolling();
    }

    /** 初始化图表 */
    initChart() {
        this.chart = new SimpleChart('spreadChart');
    }

    /** 启动定时轮询 */
    startPolling() {
        this.fetchData();
        setInterval(() => this.fetchData(), this.refreshInterval);
    }

    /** 从后端 API 获取数据 */
    async fetchData() {
        try {
            const resp = await fetch(`${this.apiBase}/api/data`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            this.updateConnectionStatus(true);
            this.updatePrices(data.prices);
            this.updateSpreads(data.spreads);
            this.updateOverview(data);
            this.updateChartData(data.spreads);
            this.updateAlerts();

            this.tickCount++;
        } catch (err) {
            console.error('数据获取失败:', err);
            this.updateConnectionStatus(false);
        }
    }

    /** 更新连接状态 */
    updateConnectionStatus(connected) {
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        const now = new Date().toLocaleTimeString('zh-CN');

        if (connected) {
            dot.className = 'status-dot';
            text.textContent = '在线';
            document.getElementById('lastUpdate').textContent = `更新于 ${now}`;
        } else {
            dot.className = 'status-dot error';
            text.textContent = '连接断开';
        }
    }

    /** 更新概览卡片 */
    updateOverview(data) {
        const prices = data.prices || [];
        const spreads = data.spreads || [];

        // 交易所数量
        document.getElementById('exchangeCount').textContent = prices.length;

        // 最大价差
        if (spreads.length > 0) {
            const max = spreads[0]; // 已按价差降序排列
            const el = document.getElementById('maxSpread');
            el.textContent = max.spread_pct.toFixed(4) + '%';
            el.className = `value ${this.getSpreadColorClass(max.spread_pct)}`;
            document.getElementById('maxSpreadPair').textContent =
                `${max.exchange_a} / ${max.exchange_b}`;
        }

        // 告警阈值
        document.getElementById('threshold').textContent = data.threshold + '%';
        this.threshold = data.threshold;

        // 累计告警
        document.getElementById('alertCount').textContent = data.alert_count || 0;

        // 数据采集次数
        document.getElementById('tickCount').textContent = this.tickCount;

        // 更新图表阈值
        if (this.chart) {
            this.chart.threshold = data.threshold;
        }
    }

    /** 更新价格表格 */
    updatePrices(prices) {
        if (!prices || prices.length === 0) return;

        document.getElementById('priceLoading').style.display = 'none';
        document.getElementById('priceTable').style.display = '';

        const tbody = document.getElementById('priceBody');
        const now = new Date().toLocaleTimeString('zh-CN');
        document.getElementById('priceUpdateTime').textContent = now;

        tbody.innerHTML = prices
            .sort((a, b) => a.exchange.localeCompare(b.exchange))
            .map(p => {
                const askBidSpread = p.ask - p.bid;
                const askBidPct = p.mid > 0 ? ((p.ask - p.bid) / p.mid * 100) : 0;
                const exchangeClass = p.exchange.toLowerCase().replace(/[.\s]/g, '');
                return `
                    <tr>
                        <td>
                            <div class="exchange-name">
                                <div class="exchange-dot ${exchangeClass}"></div>
                                <strong>${this.escapeHtml(p.exchange)}</strong>
                            </div>
                        </td>
                        <td class="price-neutral">${p.bid.toFixed(8)}</td>
                        <td class="price-neutral">${p.ask.toFixed(8)}</td>
                        <td class="price-neutral" style="font-weight:600;">${p.mid.toFixed(8)}</td>
                        <td class="price-neutral">${askBidPct.toFixed(4)}%</td>
                        <td style="color:#8b949e;font-size:12px;">${this.escapeHtml(p.source || '--')}</td>
                    </tr>
                `;
            }).join('');
    }

    /** 更新价差网格 */
    updateSpreads(spreads) {
        if (!spreads || spreads.length === 0) return;

        document.getElementById('spreadLoading').style.display = 'none';
        document.getElementById('spreadGrid').style.display = '';
        document.getElementById('spreadCount').textContent = `${spreads.length} 对`;

        const grid = document.getElementById('spreadGrid');
        grid.innerHTML = spreads.map(s => {
            const colorClass = this.getSpreadColorClass(s.spread_pct);
            const isAlert = s.spread_pct >= this.threshold;
            return `
                <div class="spread-item ${isAlert ? 'alert' : ''}">
                    <div class="spread-pair">
                        ${isAlert ? '<span class="alert-badge">ALERT</span> ' : ''}
                        ${this.escapeHtml(s.exchange_a)} / ${this.escapeHtml(s.exchange_b)}
                    </div>
                    <div class="spread-pct ${colorClass}">${s.spread_pct.toFixed(4)}%</div>
                    <div class="spread-values">
                        <span>${s.exchange_a}: mid=${s.mid_a}</span>
                        <span>${s.exchange_b}: mid=${s.mid_b}</span>
                    </div>
                    <div style="font-size:11px;color:#8b949e;margin-top:4px;">
                        方向: ${this.escapeHtml(s.direction)}
                    </div>
                </div>
            `;
        }).join('');
    }

    /** 更新图表数据 */
    updateChartData(spreads) {
        if (!spreads || spreads.length === 0) return;

        const timeStr = new Date().toLocaleTimeString('zh-CN', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
        });

        // 取价差最大的几对用于图表（最多 4 条线）
        const pairsToShow = spreads.slice(0, 4);

        pairsToShow.forEach(s => {
            const key = `${s.exchange_a}/${s.exchange_b}`;
            if (!this.chartData[key]) {
                this.chartData[key] = [];
            }
            this.chartData[key].push({ x: timeStr, y: s.spread_pct });

            // 限制数据点数量
            if (this.chartData[key].length > this.maxChartData) {
                this.chartData[key].shift();
            }
        });

        // 绘制图表
        if (this.chart) {
            this.chart.setData(this.chartData, this.threshold);
        }
    }

    /** 更新告警日志 */
    async updateAlerts() {
        try {
            const resp = await fetch(`${this.apiBase}/api/alerts`);
            if (!resp.ok) return;
            const data = await resp.json();

            const list = document.getElementById('alertsList');
            const alerts = data.alerts || [];

            document.getElementById('alertLogCount').textContent = `${alerts.length} 条`;

            if (alerts.length === 0) {
                list.innerHTML = '<div class="no-alerts">暂无告警记录</div>';
                return;
            }

            // 按时间倒序显示
            list.innerHTML = alerts
                .slice()
                .reverse()
                .slice(0, 50)  // 最多显示 50 条
                .map(a => `
                    <div class="alert-item">
                        <span class="alert-icon">🚨</span>
                        <span class="alert-time">${this.escapeHtml(a.time)}</span>
                        <span class="alert-text">
                            ${this.escapeHtml(a.pair)} - 价差 ${a.spread_pct.toFixed(4)}%
                        </span>
                    </div>
                `).join('');
        } catch (err) {
            // 静默处理告警获取失败
        }
    }

    /** 根据价差值获取 CSS 颜色类 */
    getSpreadColorClass(pct) {
        if (pct < 0.01) return 'low';
        if (pct < this.threshold) return 'medium';
        return 'high';
    }

    /** HTML 转义，防止 XSS */
    escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
}

//  页面加载完成后初始化看板

document.addEventListener('DOMContentLoaded', () => {
    window.dashboard = new StablecoinMonitorDashboard();
});
